name: life_kingdom
description: "Life Kingdom - a gamified habit and self-development app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_svg: ^2.0.10+1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/characters/archer/
    - assets/characters/boar_rider/
    - assets/characters/brute/
    - assets/characters/builder/
    - assets/characters/crimson_maiden/
    - assets/characters/drake/
    - assets/characters/gremlin/
    - assets/characters/huntress_queen/
    - assets/characters/iron_colossus/
    - assets/characters/lancer_champion/
    - assets/characters/oracle/
    - assets/characters/raider/
    - assets/characters/seraph/
    - assets/characters/sorcerer/
    - assets/characters/warlord/
    - assets/heroes/hero_knight/
