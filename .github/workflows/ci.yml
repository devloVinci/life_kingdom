name: CI
on:
  push:
    branches: [feat/simple-direction]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Screenshots for review
        if: always()
        run: flutter test --update-goldens test_visual || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test_visual/goldens/
          if-no-files-found: warn
      - name: Print screenshots (base64 jpeg)
        if: always()
        run: |
          cd test_visual/goldens || exit 0
          for f in *.png; do
            convert "$f" -resize 50% -quality 82 "/tmp/${f%.png}.jpg"
            echo "=====SHOT ${f%.png}"
            base64 -w 0 "/tmp/${f%.png}.jpg"; echo
            echo "=====END"
          done
